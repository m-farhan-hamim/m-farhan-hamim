<svg xmlns="http://www.w3.org/2000/svg" width="800" height="140" viewBox="0 0 800 140">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#0d1117" />
    </linearGradient>
    <style>
      @keyframes floatUp { 0% { transform: translateY(0px); } 50% { transform: translateY(-5px); } 100% { transform: translateY(0px); } }
      @keyframes floatDown { 0% { transform: translateY(0px); } 50% { transform: translateY(5px); } 100% { transform: translateY(0px); } }
      @keyframes fadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }
      .wave-anim { animation: floatDown 4s ease-in-out infinite; }
      .text-anim { animation: fadeIn 1s ease-out forwards; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117" />
  <path d="M0,40 Q200,80 400,40 T800,40 L800,0 L0,0 Z" fill="url(#waveGrad)" opacity="0.8" class="wave-anim" />
  <text x="400" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#ffffff" font-weight="bold" text-anchor="middle" class="text-anim">M. Farhan Hamim</text>
  <text x="400" y="110" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8B949E" text-anchor="middle" class="text-anim" style="animation-delay: 0.3s">CEO @ PSBDx | WordPress Plugin Developer</text>
</svg>