<svg xmlns="http://www.w3.org/2000/svg" width="800" height="220" viewBox="0 0 800 220">
  <defs>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#1f6feb" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#0d1117" />
  <path d="M0,180 Q200,140 400,180 T800,180 L800,220 L0,220 Z" fill="url(#waveGrad)" opacity="0.8">
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-5;0,0" dur="4s" repeatCount="indefinite" />
  </path>
  <text x="400" y="90" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#ffffff" font-weight="bold" text-anchor="middle">
    M. Farhan Hamim
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" />
  </text>
  <text x="400" y="130" font-family="system-ui, -apple-system, sans-serif" font-size="16" fill="#8B949E" text-anchor="middle">
    CEO @ PSBDx | WordPress Plugin Developer
    <animate attributeName="opacity" values="0;1" dur="0.8s" fill="freeze" begin="0.3s" />
  </text>
</svg>