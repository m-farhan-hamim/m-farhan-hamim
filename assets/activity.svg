<svg xmlns="http://www.w3.org/2000/svg" width="800" height="255" viewBox="0 0 800 255">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#161b22" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1f6feb" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="100%" height="100%" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />
  <text x="30" y="40" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#58A6FF" font-weight="bold">⚡ Dynamic Activity</text>
  <circle cx="740" cy="35" r="6" fill="#3FB950">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
  </circle>
  <text x="30" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B949E">Repository</text>
  <text x="450" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B949E">Activity</text>
  <text x="650" y="75" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="#8B949E">Date</text>
  <line x1="20" y1="85" x2="780" y2="85" stroke="#30363d" stroke-width="1" />
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.1s" />
    <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" dur="0.5s" fill="freeze" begin="0.1s" />
    <text x="30" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#58A6FF" font-weight="bold">m-farhan-hamim</text>
    <text x="450" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#3FB950">⚡ Pushed commits</text>
    <text x="650" y="115" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#8B949E">2026-10-08</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.2s" />
    <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" dur="0.5s" fill="freeze" begin="0.2s" />
    <text x="30" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#58A6FF" font-weight="bold">NetShield-DNS-Resolver-by-PSBDx</text>
    <text x="450" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#3FB950">⚡ Pushed commits</text>
    <text x="650" y="160" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#8B949E">2026-10-08</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.5s" fill="freeze" begin="0.30000000000000004s" />
    <animateTransform attributeName="transform" type="translate" values="-30,0;0,0" dur="0.5s" fill="freeze" begin="0.30000000000000004s" />
    <text x="30" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#58A6FF" font-weight="bold">PSBDx-SVN</text>
    <text x="450" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#3FB950">⚡ Pushed commits</text>
    <text x="650" y="205" font-family="system-ui, -apple-system, sans-serif" font-size="15" fill="#8B949E">2026-10-08</text>
  </g>
</svg>